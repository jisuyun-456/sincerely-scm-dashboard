name: TMS box-mix forecast sync (17:00 KST)

on:
  schedule:
    # 17:00 KST = 08:00 UTC weekdays
    - cron: "0 8 * * 1-5"
  workflow_dispatch:

jobs:
  box-mix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: sync/requirements.txt

      - name: Install deps
        working-directory: sync
        run: pip install -r requirements.txt

      - name: Sync TMS box-mix forecast
        working-directory: sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIRTABLE_PAT_TMS: ${{ secrets.AIRTABLE_PAT_TMS }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python sync_tms_box_mix.py
