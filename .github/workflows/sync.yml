name: Daily sync (Airtable + Vault → Supabase)

on:
  schedule:
    # 00:00 KST = 15:00 UTC (previous day)
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: sync/requirements.txt

      - name: Install deps
        working-directory: sync
        run: pip install -r requirements.txt

      - name: Run sync runner
        working-directory: sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIRTABLE_WMS_PAT: ${{ secrets.AIRTABLE_WMS_PAT }}
          AIRTABLE_PAT_TMS: ${{ secrets.AIRTABLE_PAT_TMS }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_PAT_BARCODE }}
          AIRTABLE_BASE_TMS: ${{ secrets.AIRTABLE_BASE_TMS }}
          SCM_WORK_RAW_BASE: ${{ secrets.SCM_WORK_RAW_BASE }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python _sync_runner.py
